name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, design and translation checks, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:design
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  database:
    name: Database schema and policies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run-local.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  accounts:
    name: Browser tests with accounts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A full local Supabase stack: database, sign-in, Data API and storage.
      # Its fixed ports (54321-54322) sit in the range the system hands out
      # for outgoing connections, so one is occasionally taken for a moment
      # and the start fails with "address already in use". Starting again
      # after a short wait gets a free port.
      - name: Start Supabase
        run: |
          for attempt in 1 2 3; do
            if npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta; then
              exit 0
            fi
            echo "Supabase did not start (attempt $attempt of 3); retrying."
            npx supabase stop --no-backup || true
            sleep 10
          done
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.accounts.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-accounts-results
          path: test-results/
          retention-days: 7
